<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Make a birthday wish, Selvi</title>
  <style>
    :root { --wine:#6b1749; --pink:#f6558c; --cream:#fff9e8; --gold:#ffd653; }
    * { box-sizing:border-box; } body { margin:0; min-width:900px; min-height:100vh; overflow:hidden; font-family:"Trebuchet MS","Arial Rounded MT Bold",sans-serif; color:var(--wine); background:radial-gradient(circle at 50% 36%,#fff8d4 0%,#ffd8df 38%,#a89ee1 100%); }
    .glow { position:fixed; inset:0; pointer-events:none; background:radial-gradient(circle at 50% 48%,#fff8bb80 0 3%,transparent 16%),radial-gradient(#fff 1.2px,transparent 2px); background-size:auto,72px 72px; animation:shine 2s ease-in-out infinite alternate; } @keyframes shine { to { opacity:.55; } }
    main { position:relative; z-index:1; height:100vh; width:min(1020px,94vw); margin:auto; padding:47px 30px; text-align:center; }
    h1 { margin:0; color:#a51d58; font-family:Georgia,serif; font-size:clamp(3rem,5vw,5.2rem); text-shadow:3px 3px #fff6e4; } .lead { margin:10px 0 0; font-size:1.2rem; font-weight:bold; }
    .stage { height:560px; position:relative; display:grid; place-items:center; }
    .cake-wrap { position:absolute; top:70px; width:400px; height:420px; transition:all .9s cubic-bezier(.45,-.2,.8,.4); } .cake-wrap.leave { opacity:0; transform:translateY(-90px) scale(.7) rotate(-8deg); }
    .table { position:absolute; z-index:-1; bottom:45px; left:-55px; right:-55px; height:76px; border-radius:50%; background:#9f426a; box-shadow:inset 0 -20px #78304f,0 15px 18px #711b4640; }
    .cake { position:absolute; bottom:75px; left:60px; width:280px; height:205px; border-radius:18px 18px 31px 31px; background:repeating-linear-gradient(0deg,#ef7299 0 23px,#ffb0c6 24px 48px); border-bottom:16px solid #bd3c70; box-shadow:0 12px 0 #8a345a; } .cake:before { content:""; position:absolute; left:0; right:0; top:-17px; height:35px; border-radius:50%; background:#fff6e6; box-shadow:inset 0 -8px #ffd3df; } .cake:after { content:"♥  ♥  ♥"; position:absolute; left:63px; top:42px; color:#fff7df; font-size:32px; letter-spacing:9px; }
    .candle { position:absolute; z-index:3; left:185px; bottom:266px; width:24px; height:88px; border-radius:5px; background:repeating-linear-gradient(45deg,#fff 0 7px,#ed5b83 7px 14px); box-shadow:inset -4px 0 #bc315d; } .wick { position:absolute; left:10px; top:-11px; width:4px; height:15px; border-radius:50%; background:#40213d; } .flame { position:absolute; left:-16px; top:-57px; width:55px; height:69px; border-radius:55% 45% 55% 45%; transform:rotate(-45deg); background:radial-gradient(circle at 68% 69%,#fffbd2 0 16%,#ffcf38 17% 37%,#ff6c42 38% 65%,transparent 66%); filter:drop-shadow(0 0 14px #ffbd39); transform-origin:bottom center; animation:flicker .35s ease-in-out infinite alternate; } @keyframes flicker { to { transform:rotate(-39deg) scale(.9,1.08); } } .flame.out { animation:out .5s forwards; } @keyframes out { to { opacity:0; transform:rotate(-45deg) scale(.05); } }
    .instructions { position:absolute; width:100%; bottom:0; } #blow { border:0; border-radius:999px; padding:14px 28px; background:linear-gradient(135deg,#f6558c,#a62f70); color:white; font:900 1rem "Trebuchet MS",sans-serif; cursor:pointer; box-shadow:0 5px 0 #832150; } #blow:hover { transform:translateY(-2px); } #status { margin:13px 0 0; font-weight:bold; color:#773454; min-height:1.3em; }
    .bouquet { position:absolute; top:35px; left:50%; width:400px; height:430px; display:none; transform:translateX(-50%); } .bouquet.show { display:block; animation:bloom .95s cubic-bezier(.2,1.4,.3,1) both; } .bouquet img { display:block; width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 16px 13px #76214940); } @keyframes bloom { from { opacity:0; transform:translateX(-50%) scale(.2) rotate(-15deg); } to { opacity:1; transform:translateX(-50%) scale(1) rotate(0); } }
    .flower { position:absolute; width:122px; height:122px; border-radius:50%; background:radial-gradient(circle,#ffd759 0 18%,transparent 19%),radial-gradient(ellipse at 50% 13%,var(--petal) 0 33%,transparent 34%),radial-gradient(ellipse at 87% 50%,var(--petal) 0 33%,transparent 34%),radial-gradient(ellipse at 50% 87%,var(--petal) 0 33%,transparent 34%),radial-gradient(ellipse at 13% 50%,var(--petal) 0 33%,transparent 34%); filter:drop-shadow(0 8px 4px #70264938); } .f1{--petal:#f65b8f;left:35px;top:120px}.f2{--petal:#ffc952;left:125px;top:42px}.f3{--petal:#8f72d8;right:31px;top:119px}.f4{--petal:#f689ad;left:133px;top:170px}.f5{--petal:#63bda9;right:99px;top:211px}.leaves { position:absolute; width:280px; height:220px; left:61px; top:150px; background:radial-gradient(ellipse at 30% 85%,#3b9a72 0 13%,transparent 14%),radial-gradient(ellipse at 69% 87%,#3b9a72 0 13%,transparent 14%),radial-gradient(ellipse at 16% 53%,#3b9a72 0 13%,transparent 14%),radial-gradient(ellipse at 84% 52%,#3b9a72 0 13%,transparent 14%); z-index:-1; } .wrap { position:absolute; width:190px; height:158px; left:101px; bottom:0; clip-path:polygon(0 0,100% 0,78% 100%,22% 100%); background:linear-gradient(135deg,#ffe6a2,#ee9bba); box-shadow:inset -20px -10px #c56f91; } .ribbon { position:absolute; z-index:2; width:200px; height:38px; left:95px; bottom:45px; background:#f55187; border-radius:50%; transform:rotate(-3deg); } .ribbon:after { content:"♥"; color:#fff7de; font-size:24px; line-height:36px; }
    #continue { display:none; position:absolute; bottom:-67px; left:50%; transform:translateX(-50%); border:0; border-radius:999px; padding:14px 29px; background:linear-gradient(135deg,#6e5bd5,#a72f70); color:white; box-shadow:0 5px 0 #503e99; text-decoration:none; font-weight:900; } #continue.show { display:block; animation:rise .6s .55s both; } @keyframes rise { from { opacity:0; transform:translate(-50%,20px); } to { opacity:1; transform:translate(-50%,0); } }
    @media (max-width:900px) { body { min-width:0; overflow:auto; } main { padding:35px 12px; } .stage { height:570px; } }
  </style>
</head>
<body>
  <div class="glow"></div>
  <main>
    <h1>Make a birthday wish, Selvi ✨</h1><p class="lead">Close your eyes, make your wish… then blow the candle!</p>
    <section class="stage">
      <div class="cake-wrap" id="cake"><div class="table"></div><div class="candle"><div class="wick"></div><div class="flame" id="flame"></div></div><div class="cake"></div></div>
      <div class="bouquet" id="bouquet"><img src="real-birthday-bouquet.png" alt="A real bouquet of pink, white, and peach flowers tied with a pink ribbon." /><a id="continue" href="page4.html">Continue 💐</a></div>
      <div class="instructions"><button id="blow">I’m ready to blow! 💨</button><p id="status">Click the button, allow microphone access, and blow toward your laptop.</p></div>
    </section>
  </main>
  <script>
    const status=document.getElementById('status'), blow=document.getElementById('blow'); let finished=false, listening=false;
    function applause(){try{const a=new (window.AudioContext||window.webkitAudioContext)();for(let k=0;k<18;k++){const at=k*.105+(Math.random()*.04),duration=.075+Math.random()*.06,b=a.createBuffer(1,a.sampleRate*duration,a.sampleRate),d=b.getChannelData(0),s=a.createBufferSource(),g=a.createGain();for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);s.buffer=b;g.gain.setValueAtTime(.12+Math.random()*.08,a.currentTime+at);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+at+duration);s.connect(g).connect(a.destination);s.start(a.currentTime+at)}}catch{}}
    function reveal(){ if(finished)return; finished=true; applause(); document.getElementById('flame').classList.add('out'); status.textContent='Wish made! Here is a bouquet, just for you. 💐'; blow.style.display='none'; setTimeout(()=>{document.getElementById('cake').classList.add('leave');document.getElementById('bouquet').classList.add('show');document.getElementById('continue').classList.add('show');},520); }
    blow.addEventListener('click',async()=>{ if(listening)return; if(!navigator.mediaDevices?.getUserMedia){ status.textContent='Your browser does not support microphone input. Tap the candle to blow it out.'; document.getElementById('cake').addEventListener('click',reveal,{once:true}); return; } try { const stream=await navigator.mediaDevices.getUserMedia({audio:true}); listening=true; blow.textContent='Listening… blow now! 💨'; status.textContent='Blow toward the microphone!'; const audio=new AudioContext(), source=audio.createMediaStreamSource(stream), analyser=audio.createAnalyser(); analyser.fftSize=512; source.connect(analyser); const data=new Uint8Array(analyser.fftSize); function check(){ if(finished)return; analyser.getByteTimeDomainData(data); let sum=0; for(const n of data)sum+=(n-128)*(n-128); const volume=Math.sqrt(sum/data.length); if(volume>17){stream.getTracks().forEach(track=>track.stop());audio.close();reveal();} else requestAnimationFrame(check); } check(); } catch { status.textContent='Microphone wasn’t available. Click the candle to blow it out instead.'; document.getElementById('cake').addEventListener('click',reveal,{once:true}); } });
  </script>
</body>
</html>
