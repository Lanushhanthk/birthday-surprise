<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Make a birthday wish, Selvi</title>

  <style>
    :root {
      --wine:#6b1749;
      --pink:#f6558c;
      --cream:#fff9e8;
      --gold:#ffd653;
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
    }

    body {
      min-height:100vh;
      font-family:"Trebuchet MS","Arial Rounded MT Bold",sans-serif;
      color:var(--wine);
      background:
        radial-gradient(
          circle at 50% 36%,
          #fff8d4 0%,
          #ffd8df 38%,
          #a89ee1 100%
        );
    }

    .glow {
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(
          circle at 50% 48%,
          #fff8bb80 0 3%,
          transparent 16%
        ),
        radial-gradient(
          #fff 1.2px,
          transparent 2px
        );
      background-size:auto,72px 72px;
      animation:shine 2s ease-in-out infinite alternate;
    }

    @keyframes shine {
      to {
        opacity:.55;
      }
    }

    main {
      position:relative;
      z-index:1;
      width:min(1020px,94vw);
      height:100vh;
      min-height:0;
      margin:auto;
      padding:clamp(18px,4vh,42px) 24px 12px;
      text-align:center;
      display:flex;
      flex-direction:column;
    }

    h1 {
      margin:0;
      color:#a51d58;
      font-family:Georgia,serif;
      font-size:clamp(2rem,5vw,5.2rem);
      line-height:1.05;
      text-shadow:3px 3px #fff6e4;
      flex-shrink:0;
    }

    .lead {
      margin:8px 0 0;
      font-size:clamp(.9rem,1.8vw,1.2rem);
      font-weight:bold;
      flex-shrink:0;
    }

    .stage {
      position:relative;
      flex:1;
      min-height:0;
      width:100%;
      margin-top:4px;
      display:grid;
      place-items:center;
    }

    .cake-wrap {
      position:absolute;
      top:50%;
      left:50%;
      width:min(400px,42vw);
      height:min(420px,52vh);
      transform:translate(-50%,-45%);
      transition:all .9s cubic-bezier(.45,-.2,.8,.4);
    }

    .cake-wrap.leave {
      opacity:0;
      transform:translate(-50%,-60%) scale(.7) rotate(-8deg);
    }

    .table {
      position:absolute;
      z-index:-1;
      bottom:8%;
      left:-14%;
      right:-14%;
      height:clamp(42px,7vh,76px);
      border-radius:50%;
      background:#9f426a;
      box-shadow:
        inset 0 -20px #78304f,
        0 15px 18px #711b4640;
    }

    .cake {
      position:absolute;
      bottom:17%;
      left:15%;
      width:70%;
      height:49%;
      border-radius:18px 18px 31px 31px;
      background:
        repeating-linear-gradient(
          0deg,
          #ef7299 0 23px,
          #ffb0c6 24px 48px
        );
      border-bottom:16px solid #bd3c70;
      box-shadow:0 12px 0 #8a345a;
    }

    .cake:before {
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:-17px;
      height:35px;
      border-radius:50%;
      background:#fff6e6;
      box-shadow:inset 0 -8px #ffd3df;
    }

    .cake:after {
      content:"♥  ♥  ♥";
      position:absolute;
      left:22%;
      top:20%;
      color:#fff7df;
      font-size:clamp(20px,3vw,32px);
      letter-spacing:clamp(4px,1vw,9px);
    }

    .candle {
      position:absolute;
      z-index:3;
      left:46.25%;
      bottom:64%;
      width:clamp(18px,2.4vw,24px);
      height:clamp(64px,10vh,88px);
      border-radius:5px;
      background:
        repeating-linear-gradient(
          45deg,
          #fff 0 7px,
          #ed5b83 7px 14px
        );
      box-shadow:inset -4px 0 #bc315d;
    }

    .wick {
      position:absolute;
      left:10px;
      top:-11px;
      width:4px;
      height:15px;
      border-radius:50%;
      background:#40213d;
    }

    .flame {
      position:absolute;
      left:50%;
      top:-57px;
      width:55px;
      height:69px;
      border-radius:55% 45% 55% 45%;
      transform:translateX(-50%) rotate(-45deg);
      background:
        radial-gradient(
          circle at 68% 69%,
          #fffbd2 0 16%,
          #ffcf38 17% 37%,
          #ff6c42 38% 65%,
          transparent 66%
        );
      filter:drop-shadow(0 0 14px #ffbd39);
      transform-origin:bottom center;
      animation:flicker .35s ease-in-out infinite alternate;
    }

    @keyframes flicker {
      to {
        transform:translateX(-50%) rotate(-39deg) scale(.9,1.08);
      }
    }

    .flame.out {
      animation:out .5s forwards;
    }

    @keyframes out {
      to {
        opacity:0;
        transform:translateX(-50%) rotate(-45deg) scale(.05);
      }
    }

    .instructions {
      position:absolute;
      left:0;
      right:0;
      bottom:2px;
      z-index:5;
    }

    #blow {
      border:0;
      border-radius:999px;
      padding:clamp(10px,1.8vh,14px) clamp(20px,3vw,28px);
      background:linear-gradient(135deg,#f6558c,#a62f70);
      color:white;
      font:900 clamp(.85rem,1.5vw,1rem) "Trebuchet MS",sans-serif;
      cursor:pointer;
      box-shadow:0 5px 0 #832150;
    }

    #blow:hover {
      transform:translateY(-2px);
    }

    #status {
      margin:8px 0 0;
      font-size:clamp(.75rem,1.4vw,.95rem);
      font-weight:bold;
      color:#773454;
      min-height:1.3em;
    }

    .bouquet {
      position:absolute;
      top:50%;
      left:50%;
      width:min(400px,48vw);
      height:min(430px,62vh);
      display:none;
      transform:translate(-50%,-50%);
    }

    .bouquet.show {
      display:block;
      animation:bloom .95s cubic-bezier(.2,1.4,.3,1) both;
    }

    .bouquet img {
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
      filter:drop-shadow(0 16px 13px #76214940);
    }

    @keyframes bloom {
      from {
        opacity:0;
        transform:translate(-50%,-50%) scale(.2) rotate(-15deg);
      }

      to {
        opacity:1;
        transform:translate(-50%,-50%) scale(1) rotate(0);
      }
    }

    #continue {
      display:none;
      position:absolute;
      bottom:-5px;
      left:50%;
      transform:translateX(-50%);
      border:0;
      border-radius:999px;
      padding:clamp(10px,1.8vh,14px) clamp(22px,3vw,29px);
      background:linear-gradient(135deg,#6e5bd5,#a72f70);
      color:white;
      box-shadow:0 5px 0 #503e99;
      text-decoration:none;
      font-weight:900;
      white-space:nowrap;
    }

    #continue.show {
      display:block;
      animation:rise .6s .55s both;
    }

    @keyframes rise {
      from {
        opacity:0;
        transform:translate(-50%,20px);
      }

      to {
        opacity:1;
        transform:translate(-50%,0);
      }
    }

    @media (max-width:700px) {

      main {
        width:100%;
        padding:
          clamp(14px,3vh,25px)
          12px
          8px;
      }

      h1 {
        font-size:clamp(1.8rem,8vw,3rem);
      }

      .lead {
        font-size:.85rem;
        margin-top:6px;
      }

      .stage {
        margin-top:2px;
      }

      .cake-wrap {
        width:min(330px,78vw);
        height:min(350px,48vh);
      }

      .flame {
        width:46px;
        height:58px;
        top:-49px;
      }

      .bouquet {
        width:min(330px,76vw);
        height:min(350px,50vh);
      }

      #status {
        font-size:.72rem;
      }

      #blow {
        padding:10px 20px;
        font-size:.82rem;
      }

      #continue {
        padding:10px 22px;
        font-size:.85rem;
      }
    }

    @media (max-height:700px) and (min-width:701px) {

      main {
        padding-top:14px;
        padding-bottom:6px;
      }

      h1 {
        font-size:clamp(2rem,5vw,3.5rem);
      }

      .lead {
        margin-top:5px;
        font-size:.9rem;
      }

      .cake-wrap {
        width:min(330px,38vw);
        height:min(340px,48vh);
      }

      .bouquet {
        width:min(330px,40vw);
        height:min(350px,52vh);
      }

      #status {
        margin-top:5px;
      }
    }

    @media (max-height:560px) {

      main {
        padding-top:8px;
        padding-bottom:4px;
      }

      h1 {
        font-size:clamp(1.7rem,5vw,2.7rem);
      }

      .lead {
        font-size:.75rem;
        margin-top:3px;
      }

      .cake-wrap {
        width:270px;
        height:285px;
      }

      .bouquet {
        width:270px;
        height:285px;
      }

      #blow {
        padding:8px 18px;
      }

      #status {
        margin-top:3px;
        font-size:.68rem;
      }
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <main>

    <h1>Make a birthday wish, Selvi ✨</h1>

    <p class="lead">
      Close your eyes, make your wish… then blow the candle!
    </p>

    <section class="stage">

      <div class="cake-wrap" id="cake">

        <div class="table"></div>

        <div class="candle">
          <div class="wick"></div>
          <div class="flame" id="flame"></div>
        </div>

        <div class="cake"></div>

      </div>


      <div class="bouquet" id="bouquet">

        <img
          src="real-birthday-bouquet.png"
          alt="A real bouquet of pink, white, and peach flowers tied with a pink ribbon."
        />

        <a id="continue" href="page4.html">
          Continue 💐
        </a>

      </div>


      <div class="instructions">

        <button id="blow">
          I’m ready to blow! 💨
        </button>

        <p id="status">
          Click the button, allow microphone access, and blow toward your laptop.
        </p>

      </div>

    </section>

  </main>


  <script>

    const status = document.getElementById('status');
    const blow = document.getElementById('blow');

    let finished = false;
    let listening = false;


    // Clapping sound when the candle is successfully blown out
    function applause() {

      try {

        const a = new (window.AudioContext || window.webkitAudioContext)();

        for (let k = 0; k < 18; k++) {

          const at =
            k * 0.105 +
            (Math.random() * 0.04);

          const duration =
            0.075 +
            Math.random() * 0.06;

          const b =
            a.createBuffer(
              1,
              a.sampleRate * duration,
              a.sampleRate
            );

          const d =
            b.getChannelData(0);

          const s =
            a.createBufferSource();

          const g =
            a.createGain();

          for (let i = 0; i < d.length; i++) {

            d[i] =
              (Math.random() * 2 - 1) *
              (1 - i / d.length);

          }

          s.buffer = b;

          g.gain.setValueAtTime(
            0.12 + Math.random() * 0.08,
            a.currentTime + at
          );

          g.gain.exponentialRampToValueAtTime(
            0.001,
            a.currentTime + at + duration
          );

          s.connect(g).connect(a.destination);

          s.start(a.currentTime + at);

        }

      } catch {}

    }


    function reveal() {

      if (finished) return;

      finished = true;

      // Play clapping instead of a blowing/explosion sound
      applause();

      document
        .getElementById('flame')
        .classList
        .add('out');

      status.textContent =
        'Wish made! Here is a bouquet, just for you. 💐';

      blow.style.display = 'none';


      setTimeout(() => {

        document
          .getElementById('cake')
          .classList
          .add('leave');

        document
          .getElementById('bouquet')
          .classList
          .add('show');

        document
          .getElementById('continue')
          .classList
          .add('show');

      }, 520);

    }


    blow.addEventListener(
      'click',
      async () => {

        if (listening) return;


        if (!navigator.mediaDevices?.getUserMedia) {

          status.textContent =
            'Your browser does not support microphone input. Tap the candle to blow it out.';

          document
            .getElementById('cake')
            .addEventListener(
              'click',
              reveal,
              { once:true }
            );

          return;

        }


        try {

          const stream =
            await navigator.mediaDevices.getUserMedia({
              audio:true
            });

          listening = true;

          blow.textContent =
            'Listening… blow now! 💨';

          status.textContent =
            'Blow toward the microphone!';


          const audio =
            new AudioContext();

          const source =
            audio.createMediaStreamSource(stream);

          const analyser =
            audio.createAnalyser();

          analyser.fftSize = 512;

          source.connect(analyser);

          const data =
            new Uint8Array(analyser.fftSize);


          function check() {

            if (finished) return;

            analyser.getByteTimeDomainData(data);

            let sum = 0;

            for (const n of data) {

              sum +=
                (n - 128) *
                (n - 128);

            }

            const volume =
              Math.sqrt(
                sum / data.length
              );


            if (volume > 17) {

              stream
                .getTracks()
                .forEach(track => track.stop());

              audio.close();

              reveal();

            } else {

              requestAnimationFrame(check);

            }

          }


          check();

        } catch {

          status.textContent =
            'Microphone wasn’t available. Click the candle to blow it out instead.';

          document
            .getElementById('cake')
            .addEventListener(
              'click',
              reveal,
              { once:true }
            );

        }

      }
    );

  </script>

</body>
</html>
